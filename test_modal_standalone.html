<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Test</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .audit-report-cell {
            max-width: 200px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            border: 1px solid #ddd;
            padding: 8px;
            margin: 5px;
            border-radius: 4px;
        }
        .audit-report-cell:hover {
            background-color: #f0f4ff;
            transform: scale(1.02);
        }
        .audit-report-truncated {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #667eea;
            font-weight: 500;
        }
        .audit-report-indicator {
            position: absolute;
            top: 2px;
            right: 2px;
            background: #667eea;
            color: white;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            cursor: pointer;
        }
        
        .modal-content {
            border-radius: 12px;
            border: none;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px 12px 0 0;
            border: none;
        }
        .modal-body {
            max-height: 70vh;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }
        .audit-report-content {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2>Audit Report Modal Test</h2>
        <p>Click on the audit report cells below to test the modal functionality:</p>
        
        <div class="audit-report-cell" 
             data-report-type="audit_report" 
             data-customer-name="Nitesh More" 
             data-business-name="Niranjan Enterprises" 
             data-report-content="# FREE AI MARKETING AUDIT REPORT

**Business:** Niranjan Enterprises  
**Industry:** Manufacturing  
**Goal:** Lead Generation  
**Budget:** Under ₹10,000/month

---

## 1. WEBSITE FIRST IMPRESSION

**Critical Issues Identified:**

- **Loading Speed:** Your website takes 4-6 seconds to load - 47% of visitors expect pages to load in 2 seconds or less
- **Mobile Experience:** Navigation is clunky on mobile devices, where 68% of your B2B buyers are researching
- **Trust Signals Missing:** No client testimonials, certifications, or case studies visible above the fold"
             onclick="showAuditReportModal(this)">
            <span class="audit-report-truncated"># FREE AI MARKETING AUDIT REPORT ## 1. WEBSITE FIRST IMPRESSION...</span>
            <span class="audit-report-indicator">
                <i class="fas fa-expand"></i>
            </span>
        </div>
        
        <div class="audit-report-cell" 
             data-report-type="audit_report_plain" 
             data-customer-name="Nitesh More" 
             data-business-name="Prakash Electricals" 
             data-report-content="1. Website First Impression
• Loading Speed: Site loads in 4.2 seconds on mobile, 2.8x slower than optimal for local service businesses
• Mobile Experience: Contact buttons are too small (under 44px) and service listings are not thumb-friendly
• Trust Signals: Missing Google Reviews display, no certifications shown, and no local testimonials visible
• First Impression Score: 4/10

2. SEO & Google Visibility
• Domain Authority: 12/100 (Industry average: 25-35)
• Organic Keywords: Ranking for only 23 keywords, mostly branded terms
• SEO Health Score: 3/10"
             onclick="showAuditReportModal(this)">
            <span class="audit-report-truncated">1. Website First Impression • Loading Speed: Site loads in 4.2 seconds...</span>
            <span class="audit-report-indicator">
                <i class="fas fa-expand"></i>
            </span>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="auditReportModal" tabindex="-1" aria-labelledby="auditReportModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="auditReportModalLabel">
                        <i class="fas fa-file-alt me-2"></i>
                        <span id="modalTitle">Audit Report</span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <small class="text-muted">
                            <i class="fas fa-user me-1"></i>
                            <strong>Name:</strong> <span id="modalCustomerName"></span><br>
                            <i class="fas fa-building me-1"></i>
                            <strong>Business:</strong> <span id="modalBusinessName"></span><br>
                            <i class="fas fa-tag me-1"></i>
                            <strong>Type:</strong> <span id="modalReportType"></span>
                        </small>
                    </div>
                    <div class="audit-report-content" id="modalContent">
                        <!-- Content will be inserted here -->
                    </div>
                    <div class="mt-3">
                        <button onclick="copyAuditReportContent()" class="btn btn-sm btn-outline-primary">
                            <i class="fas fa-copy me-1"></i>Copy Content
                        </button>
                        <button onclick="downloadAuditReport()" class="btn btn-sm btn-outline-success">
                            <i class="fas fa-download me-1"></i>Download
                        </button>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    // Audit Report Modal Functions
    let currentAuditContent = '';
    let currentReportType = '';
    
    function showAuditReportModal(element) {
        // Get data from element attributes
        const reportType = element.getAttribute('data-report-type');
        const customerName = element.getAttribute('data-customer-name');
        const businessName = element.getAttribute('data-business-name');
        const content = element.getAttribute('data-report-content');
        
        // Decode HTML entities
        const decodedContent = content.replace(/&quot;/g, '"').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>');
        
        currentAuditContent = decodedContent;
        currentReportType = reportType;
        
        console.log('Modal data:', { reportType, customerName, businessName, contentLength: decodedContent.length });
        
        // Set modal header info
        document.getElementById('modalTitle').textContent = reportType.replace('_', ' ').toUpperCase();
        document.getElementById('modalCustomerName').textContent = customerName;
        document.getElementById('modalBusinessName').textContent = businessName;
        document.getElementById('modalReportType').textContent = reportType.replace('_', ' ').replace(/\b\w/g, l => l.toUpperCase());
        
        // Set modal content
        const contentDiv = document.getElementById('modalContent');
        
        if (reportType === 'audit_report') {
            // Formatted report with HTML/markdown
            contentDiv.innerHTML = formatAuditReport(decodedContent);
            contentDiv.className = 'audit-report-content audit-report-formatted';
        } else {
            // Plain text report
            contentDiv.textContent = decodedContent;
            contentDiv.className = 'audit-report-content';
        }
        
        console.log('Modal content set, showing modal...');
        
        // Show modal
        try {
            const modal = new bootstrap.Modal(document.getElementById('auditReportModal'));
            modal.show();
            console.log('Modal should be visible now');
        } catch (error) {
            console.error('Error showing modal:', error);
            alert('Error showing modal: ' + error.message);
        }
    }
    
    function formatAuditReport(content) {
        // Convert markdown-like content to HTML
        let formatted = content
            // Headers
            .replace(/^# (.*$)/gim, '<h1>$1</h1>')
            .replace(/^## (.*$)/gim, '<h2>$1</h2>')
            .replace(/^### (.*$)/gim, '<h3>$1</h3>')
            // Bold text
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            // Lists
            .replace(/^- (.*$)/gim, '<li>$1</li>')
            .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
            // Line breaks
            .replace(/\n\n/g, '</p><p>')
            .replace(/\n/g, '<br>');
        
        // Wrap in paragraphs if not already wrapped
        if (!formatted.startsWith('<h1>') && !formatted.startsWith('<h2>') && !formatted.startsWith('<h3>') && !formatted.startsWith('<ul>')) {
            formatted = '<p>' + formatted + '</p>';
        }
        
        return formatted;
    }
    
    function copyAuditReportContent() {
        const textArea = document.createElement('textarea');
        textArea.value = currentAuditContent;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        
        alert('Content copied to clipboard!');
    }
    
    function downloadAuditReport() {
        const customerName = document.getElementById('modalCustomerName').textContent;
        const businessName = document.getElementById('modalBusinessName').textContent;
        const filename = `${customerName}_${businessName}_${currentReportType}.txt`.replace(/[^a-z0-9_\-]/gi, '_');
        
        const blob = new Blob([currentAuditContent], { type: 'text/plain' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
        
        alert('Report downloaded successfully!');
    }
    </script>
</body>
</html>
