<!DOCTYPE html>
<html>
<head>
    <title>Debug Modal Issue</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2>Debug Modal Issue</h2>
        
        <div class="card">
            <div class="card-header">
                <h5>Modal Test</h5>
            </div>
            <div class="card-body">
                <button type="button" class="btn btn-success" id="test-modal-btn">
                    <i class="fas fa-plus-circle"></i> Test Modal
                </button>
                
                <div id="debug-info" class="mt-3">
                    <h6>Debug Information:</h6>
                    <div id="debug-output"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Test Modal -->
    <div class="modal fade" id="testModal" tabindex="-1" aria-labelledby="testModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="testModalLabel">
                        <i class="fas fa-plus-circle"></i> Test Modal
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>This is a test modal to check if Bootstrap modals work properly.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    $(document).ready(function() {
        function updateDebugInfo(message) {
            var timestamp = new Date().toLocaleTimeString();
            var debugHtml = `<div class="alert alert-info">[${timestamp}] ${message}</div>`;
            $('#debug-output').prepend(debugHtml);
        }
        
        updateDebugInfo('jQuery loaded');
        updateDebugInfo('Bootstrap loaded');
        
        // Check if Bootstrap Modal is available
        if (typeof bootstrap !== 'undefined') {
            updateDebugInfo('✅ Bootstrap Modal is available');
        } else {
            updateDebugInfo('❌ Bootstrap Modal is NOT available!');
            return;
        }
        
        // Test modal initialization
        try {
            var testModal = new bootstrap.Modal(document.getElementById('testModal'));
            updateDebugInfo('✅ Test modal initialized successfully');
            
            $('#test-modal-btn').click(function() {
                updateDebugInfo('🔘 Test button clicked');
                testModal.show();
                updateDebugInfo('✅ Modal show() called');
            });
            
        } catch (error) {
            updateDebugInfo('❌ Error initializing modal: ' + error.message);
        }
    });
    </script>
</body>
</html>
