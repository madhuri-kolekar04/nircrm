<!DOCTYPE html>
<html>
<head>
    <title>Route Test Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container { max-width: 800px; margin-top: 50px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📧 Email Route Test</h2>
        
        <div class="card">
            <div class="card-header">
                <h5>Test Email Sending via Form</h5>
            </div>
            <div class="card-body">
                <form id="testForm" method="POST" action="">
                    <input type="hidden" name="_token" id="csrf_token">
                    
                    <div class="mb-3">
                        <label for="leadId" class="form-label">Lead ID:</label>
                        <input type="number" class="form-control" id="leadId" name="lead_id" value="1" required>
                        <small class="text-muted">Enter a valid lead ID that has an invoice</small>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">Email:</label>
                        <input type="email" class="form-control" id="email" name="email" value="test@example.com" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="invoiceNumber" class="form-label">Invoice Number:</label>
                        <input type="text" class="form-control" id="invoiceNumber" name="invoice_number" value="INV-2024-0001" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-paper-plane"></i> Send Test Email
                    </button>
                    
                    <button type="button" class="btn btn-secondary ms-2" onclick="testAjax()">
                        <i class="fas fa-code"></i> Test AJAX
                    </button>
                </form>
                
                <div id="result" class="mt-3"></div>
            </div>
        </div>
        
        <div class="card mt-3">
            <div class="card-header">
                <h5>Debug Information</h5>
            </div>
            <div class="card-body">
                <div id="debugInfo"></div>
            </div>
        </div>
    </div>

    <script>
        // Get CSRF token from meta tag or create one
        function getCsrfToken() {
            const meta = document.querySelector('meta[name="csrf-token"]');
            if (meta) {
                return meta.getAttribute('content');
            }
            // Fallback: try to get from Laravel session
            return '';
        }
        
        // Initialize form
        document.addEventListener('DOMContentLoaded', function() {
            const csrfToken = getCsrfToken();
            document.getElementById('csrf_token').value = csrfToken;
            
            // Set form action based on lead ID
            const leadId = document.getElementById('leadId').value;
            document.getElementById('testForm').action = '/sales-department/' + leadId + '/send-approval-email';
            
            // Show debug info
            const debugInfo = document.getElementById('debugInfo');
            debugInfo.innerHTML = `
                <p><strong>CSRF Token:</strong> ${csrfToken ? 'Found' : 'Not Found'}</p>
                <p><strong>Form Action:</strong> ${document.getElementById('testForm').action}</p>
                <p><strong>Current URL:</strong> ${window.location.href}</p>
                <p><strong>User Agent:</strong> ${navigator.userAgent}</p>
            `;
            
            // Update form action when lead ID changes
            document.getElementById('leadId').addEventListener('change', function() {
                const newLeadId = this.value;
                document.getElementById('testForm').action = '/sales-department/' + newLeadId + '/send-approval-email';
                debugInfo.innerHTML += `<p><strong>Updated Action:</strong> ${document.getElementById('testForm').action}</p>`;
            });
        });
        
        // Handle form submission
        document.getElementById('testForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const resultDiv = document.getElementById('result');
            
            resultDiv.innerHTML = '<div class="spinner-border text-primary" role="status"></div> Sending...';
            
            fetch(this.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            })
            .then(response => {
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                return response.json();
            })
            .then(data => {
                console.log('Response data:', data);
                
                if (data.success) {
                    resultDiv.innerHTML = `
                        <div class="alert alert-success">
                            <h6>✅ Success!</h6>
                            <p>${data.message}</p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="alert alert-danger">
                            <h6>❌ Error</h6>
                            <p>${data.message}</p>
                        </div>
                    `;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                resultDiv.innerHTML = `
                    <div class="alert alert-warning">
                        <h6>⚠️ Network Error</h6>
                        <p>${error.message}</p>
                        <details>
                            <summary>Technical Details</summary>
                            <pre>${error.stack}</pre>
                        </details>
                    </div>
                `;
            });
        });
        
        // Test AJAX method
        function testAjax() {
            const leadId = document.getElementById('leadId').value;
            const email = document.getElementById('email').value;
            const invoiceNumber = document.getElementById('invoiceNumber').value;
            const csrfToken = getCsrfToken();
            
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="spinner-border text-info" role="status"></div> Testing AJAX...';
            
            fetch('/sales-department/' + leadId + '/send-approval-email', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-TOKEN': csrfToken,
                    'Accept': 'application/json'
                },
                body: JSON.stringify({
                    lead_id: leadId,
                    email: email,
                    invoice_number: invoiceNumber
                })
            })
            .then(response => response.json())
            .then(data => {
                console.log('AJAX Response:', data);
                resultDiv.innerHTML = `
                    <div class="alert alert-info">
                        <h6>🔧 AJAX Test Result</h6>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `;
            })
            .catch(error => {
                console.error('AJAX Error:', error);
                resultDiv.innerHTML = `
                    <div class="alert alert-danger">
                        <h6>❌ AJAX Failed</h6>
                        <p>${error.message}</p>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
