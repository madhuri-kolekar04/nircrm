  <!-- Logo Text -->
  <text x="50" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="url(#logoGradient)">Promising</text>
  <text x="130" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="300" fill="#666">Help-Desk</text>
