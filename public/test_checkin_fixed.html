<!DOCTYPE html>
<html>
<head>
    <title>Check-In Fix Verification</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Attendance Check-In Test</h5>
                    </div>
                    <div class="card-body">
                        <p class="text-muted">This page tests the fixed check-in functionality.</p>
                        
                        <div class="d-grid gap-2">
                            <button id="testCheckIn" class="btn btn-success btn-lg">
                                <i class="fas fa-sign-in-alt me-2"></i>Test Check-In Now
                            </button>
                        </div>
                        
                        <div id="result" class="mt-3"></div>
                        
                        <div class="mt-3">
                            <small class="text-muted">
                                <strong>What was fixed:</strong><br>
                                • Added CSRF token to AJAX request<br>
                                • Improved error handling<br>
                                • Added location parameter<br>
                                • Better error message display
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    $(document).ready(function() {
        $('#testCheckIn').click(function() {
            var btn = $(this);
            btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin me-2"></i>Testing Check-In...');
            
            // Setup CSRF token (this was missing before)
            $.ajaxSetup({
                headers: {
                    'X-CSRF-TOKEN': $('meta[name="csrf-token"]').attr('content')
                }
            });
            
            $.post('/attendance/check-in', {location: 'Office'})
                .done(function(response) {
                    if (response.success) {
                        $('#result').html(`
                            <div class="alert alert-success">
                                <h6><i class="fas fa-check-circle me-2"></i>Success!</h6>
                                <p class="mb-0">${response.message}</p>
                                <small class="text-muted">Check-in time: ${response.data.check_in_time}</small>
                            </div>
                        `);
                    } else {
                        $('#result').html(`
                            <div class="alert alert-warning">
                                <h6><i class="fas fa-exclamation-circle me-2"></i>Issue</h6>
                                <p class="mb-0">${response.message}</p>
                            </div>
                        `);
                    }
                    btn.prop('disabled', false).html('<i class="fas fa-sign-in-alt me-2"></i>Test Check-In Now');
                })
                .fail(function(xhr) {
                    var errorMessage = 'Failed to check in. Please try again.';
                    
                    if (xhr.responseJSON && xhr.responseJSON.message) {
                        errorMessage = xhr.responseJSON.message;
                    } else if (xhr.responseText) {
                        try {
                            var response = JSON.parse(xhr.responseText);
                            if (response.message) {
                                errorMessage = response.message;
                            }
                        } catch (e) {
                            if (xhr.responseText.length < 200) {
                                errorMessage = xhr.responseText;
                            }
                        }
                    }
                    
                    $('#result').html(`
                        <div class="alert alert-danger">
                            <h6><i class="fas fa-times-circle me-2"></i>Error</h6>
                            <p class="mb-0">${errorMessage}</p>
                            <small class="text-muted">Status: ${xhr.status}</small>
                        </div>
                    `);
                    btn.prop('disabled', false).html('<i class="fas fa-sign-in-alt me-2"></i>Test Check-In Now');
                });
        });
    });
    </script>
</body>
</html>
