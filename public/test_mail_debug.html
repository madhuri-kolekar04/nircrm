<!DOCTYPE html>
<html>
<head>
    <title>Mail System Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .test-container { max-width: 800px; margin: 30px auto; }
        .test-section { margin: 20px 0; padding: 20px; border-radius: 8px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; }
        .warning { background: #fff3cd; border: 1px solid #ffeaa7; }
        .info { background: #d1ecf1; border: 1px solid #bee5eb; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; }
        .btn-test { padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🔧 Mail System Debug Test</h1>
        
        <div class="test-section info">
            <h3>📋 Test Overview</h3>
            <p>This page will test the complete mail sending and approval system step by step.</p>
        </div>

        <div class="test-section">
            <h3>🧪 Step-by-Step Testing</h3>
            
            <button class="btn btn-primary btn-test" onclick="testCSRF()">1. Test CSRF Token</button>
            <button class="btn btn-success btn-test" onclick="testLeadData()">2. Test Lead Data</button>
            <button class="btn btn-warning btn-test" onclick="testRoute()">3. Test Email Route</button>
            <button class="btn btn-info btn-test" onclick="testEmailSending()">4. Test Email Sending</button>
            <button class="btn btn-secondary btn-test" onclick="testApproval()">5. Test Approval System</button>
        </div>

        <div id="testResults"></div>
    </div>

    <script>
        function getCsrfToken() {
            const meta = document.querySelector('meta[name="csrf-token"]');
            return meta ? meta.getAttribute('content') : '';
        }

        function addResult(title, content, type = 'info') {
            const results = document.getElementById('testResults');
            const div = document.createElement('div');
            div.className = `test-section ${type}`;
            div.innerHTML = `<h4>${title}</h4>${content}`;
            results.appendChild(div);
        }

        function testCSRF() {
            addResult('🔐 Step 1: CSRF Token Test', '<div class="spinner-border text-primary"></div> Checking CSRF token...', 'info');
            
            const token = getCsrfToken();
            if (token) {
                addResult('✅ CSRF Token Found', 
                    `<p>✅ CSRF token is present</p>
                     <p><strong>Token:</strong> ${token.substring(0, 20)}...</p>
                     <p>✅ Ready for AJAX requests</p>`, 
                    'success'
                );
            } else {
                addResult('❌ CSRF Token Missing', 
                    `<p>❌ No CSRF token found</p>
                     <p>🔄 Refresh the page to get a new token</p>
                     <p>📝 Check admin_master.blade.php for meta tag</p>`, 
                    'error'
                );
            }
        }

        function testLeadData() {
            addResult('📊 Step 2: Lead Data Test', '<div class="spinner-border text-success"></div> Checking lead data...', 'info');
            
            fetch('/api/sales-department/invoice-statuses')
                .then(response => response.json())
                .then(data => {
                    if (data && data.statuses) {
                        const leadCount = Object.keys(data.statuses).length;
                        addResult('✅ Lead Data Working', 
                            `<p>✅ API endpoint working</p>
                             <p>📊 Found ${leadCount} leads with status data</p>
                             <p>🔄 Real-time updates are functional</p>`, 
                            'success'
                        );
                    } else {
                        addResult('⚠️ Lead Data Issue', 
                            `<p>⚠️ API responded but no status data</p>
                             <p>📝 Check if there are qualified leads</p>`, 
                            'warning'
                        );
                    }
                })
                .catch(error => {
                    addResult('❌ Lead Data Failed', 
                        `<p>❌ API endpoint error: ${error.message}</p>
                         <p>🔄 Check if Laravel server is running</p>
                         <p>🔍 Check authentication status</p>`, 
                        'error'
                    );
                });
        }

        function testRoute() {
            addResult('🛣️ Step 3: Route Test', '<div class="spinner-border text-warning"></div> Testing email route...', 'info');
            
            // Test with a sample lead ID
            const testLeadId = 107; // From your error message
            
            fetch(`/sales-department/${testLeadId}/send-approval-email`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-TOKEN': getCsrfToken(),
                    'Accept': 'application/json'
                },
                body: JSON.stringify({
                    test: true,
                    timestamp: new Date().toISOString()
                })
            })
            .then(response => {
                if (response.status === 404) {
                    throw new Error('Route not found (404) - Run: php artisan route:clear');
                } else if (response.status === 419) {
                    throw new Error('CSRF token mismatch - Refresh the page');
                } else if (response.status === 500) {
                    return response.text().then(text => {
                        throw new Error('Server error (500): ' + text.substring(0, 200));
                    });
                }
                
                return response.json();
            })
            .then(data => {
                addResult('✅ Route Test Success', 
                    `<p>✅ Route is working!</p>
                     <p><strong>Response:</strong></p>
                     <pre>${JSON.stringify(data, null, 2)}</pre>`, 
                    'success'
                );
            })
            .catch(error => {
                addResult('❌ Route Test Failed', 
                    `<p><strong>Error:</strong> ${error.message}</p>
                     <p><strong>Solutions:</strong></p>
                     <ul>
                        <li>Run: <code>php artisan route:clear</code></li>
                        <li>Run: <code>php artisan config:clear</code></li>
                        <li>Check if Laravel server is running</li>
                        <li>Refresh the page for new CSRF token</li>
                    </ul>`, 
                    'error'
                );
            });
        }

        function testEmailSending() {
            addResult('📧 Step 4: Email Sending Test', '<div class="spinner-border text-info"></div> Testing email sending...', 'info');
            
            const testLeadId = 107;
            const email = 'aimanustool002@gmail.com';
            const invoiceNumber = 'INV-2026-0107';
            
            fetch(`/sales-department/${testLeadId}/send-approval-email`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-TOKEN': getCsrfToken(),
                    'Accept': 'application/json'
                },
                body: JSON.stringify({
                    lead_id: testLeadId,
                    email: email,
                    invoice_number: invoiceNumber
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    addResult('✅ Email Sending Success!', 
                        `<p>🎉 Email sent successfully!</p>
                         <p><strong>To:</strong> ${email}</p>
                         <p><strong>Invoice:</strong> ${invoiceNumber}</p>
                         <p><strong>Message:</strong> ${data.message}</p>
                         <p>📧 Check your email inbox (and spam folder)</p>
                         <p>📋 Look for email with "Invoice Approval Required" subject</p>`, 
                        'success'
                    );
                } else {
                    addResult('⚠️ Email Processing Issue', 
                        `<p>⚠️ Route works but email has issues:</p>
                         <p><strong>Error:</strong> ${data.message}</p>
                         <p>📧 This could be a mail configuration issue</p>
                         <p>🔍 Check Laravel logs: storage/logs/laravel.log</p>`, 
                        'warning'
                    );
                }
            })
            .catch(error => {
                addResult('❌ Email Sending Failed', 
                    `<p><strong>Error:</strong> ${error.message}</p>
                     <p>🔧 Check the route test first</p>
                     <p>📝 Verify mail configuration in .env</p>`, 
                    'error'
                );
            });
        }

        function testApproval() {
            addResult('🔄 Step 5: Approval System Test', '<div class="spinner-border text-secondary"></div> Testing approval workflow...', 'info');
            
            addResult('🔄 Approval System Test', 
                `<p>📋 To test the approval system:</p>
                 <ol>
                     <li>Send an email using the test above</li>
                     <li>Check your email inbox for the approval email</li>
                     <li>Click the "Approve Invoice" button in the email</li>
                     <li>Return to this page and check if status changed</li>
                     <li>Or manually refresh the sales department page</li>
                 </ol>
                 <p>🔄 The status should change from "Waiting for approval" to "Approved"</p>
                 <p>🎯 The badge should change from yellow to green</p>`, 
                'info'
            );
        }

        // Auto-run CSRF test on page load
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(() => testCSRF(), 500);
        });
    </script>
</body>
</html>
