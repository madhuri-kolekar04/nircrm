<!DOCTYPE html>
<html>
<head>
    <title>Email Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Email Sending Test</h2>
        <div class="alert alert-info">
            This page will help us test the email sending functionality and debug any issues.
        </div>
        
        <button class="btn btn-primary" onclick="testEmail()">Test Email Sending</button>
        <div id="result" class="mt-3"></div>
    </div>

    <script>
        function testEmail() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="spinner-border text-primary" role="status"></div> Testing email...';
            
            // Find the first lead with invoice from the table
            fetch('/sales-department')
                .then(response => response.text())
                .then(html => {
                    // Extract lead ID from the page (this is just for testing)
                    // In real scenario, we'd get this from the table
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const emailButtons = doc.querySelectorAll('button[onclick*="sendApprovalEmail"]');
                    
                    if (emailButtons.length > 0) {
                        // Extract the lead ID from the first button
                        const onclick = emailButtons[0].getAttribute('onclick');
                        const matches = onclick.match(/sendApprovalEmail\((\d+),/);
                        
                        if (matches && matches[1]) {
                            const leadId = matches[1];
                            testEmailForLead(leadId);
                        } else {
                            resultDiv.innerHTML = '<div class="alert alert-warning">Could not extract lead ID from page</div>';
                        }
                    } else {
                        resultDiv.innerHTML = '<div class="alert alert-warning">No email buttons found on the page. Make sure there are leads with invoices and "waiting for approval" status.</div>';
                    }
                })
                .catch(error => {
                    resultDiv.innerHTML = '<div class="alert alert-danger">Error loading page: ' + error.message + '</div>';
                });
        }
        
        function testEmailForLead(leadId) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="spinner-border text-primary" role="status"></div> Sending test email for lead ID: ' + leadId;
            
            fetch(`/sales-department/${leadId}/send-approval-email`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-TOKEN': document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || ''
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    resultDiv.innerHTML = `
                        <div class="alert alert-success">
                            <h5>✅ Email Processed Successfully!</h5>
                            <p><strong>Message:</strong> ${data.message}</p>
                            <p><strong>Status:</strong> The email was processed. Check the Laravel logs for detailed information.</p>
                            <hr>
                            <h6>Next Steps:</h6>
                            <ul>
                                <li>Check the Laravel logs: <code>storage/logs/laravel.log</code></li>
                                <li>Look for "Mail configuration check" and "Approval email" entries</li>
                                <li>If SMTP failed, it should have fallen back to log driver</li>
                            </ul>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="alert alert-danger">
                            <h5>❌ Email Failed</h5>
                            <p><strong>Error:</strong> ${data.message}</p>
                            <p>Check the Laravel logs for more details.</p>
                        </div>
                    `;
                }
            })
            .catch(error => {
                resultDiv.innerHTML = `
                    <div class="alert alert-danger">
                        <h5>❌ Network Error</h5>
                        <p><strong>Error:</strong> ${error.message}</p>
                        <p>This might be a CSRF token issue or network problem.</p>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
