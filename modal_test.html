<!DOCTYPE html>
<html>
<head>
    <title>Modal Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2>Modal Test - Standalone</h2>
        
        <button class="btn btn-primary" onclick="testModal()">Test Modal</button>
        <button class="btn btn-success ms-2" onclick="openModal()">Open Modal</button>
        
        <div id="result"></div>
    </div>

    <!-- Installment Modal -->
    <div class="modal fade" id="installmentModal" tabindex="-1" aria-labelledby="installmentModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="installmentModalLabel">
                        <i class="fas fa-plus-circle"></i> Add Installment
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="installment-form">
                        <div class="mb-3">
                            <label for="modal-amount" class="form-label">Amount *</label>
                            <div class="input-group">
                                <span class="input-group-text">₹</span>
                                <input type="number" class="form-control" id="modal-amount" 
                                       placeholder="0.00" min="0" step="0.01" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="modal-date" class="form-label">Due Date *</label>
                            <input type="date" class="form-control" id="modal-date" required>
                        </div>
                        <div class="mb-3">
                            <label for="modal-notes" class="form-label">Notes</label>
                            <textarea class="form-control" id="modal-notes" rows="2" 
                                      placeholder="Optional notes for this installment"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="submitInstallment()">
                        <i class="fas fa-save"></i> Add Installment
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let installmentModal;
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Initializing standalone modal');
            
            const modalElement = document.getElementById('installmentModal');
            if (modalElement) {
                installmentModal = new bootstrap.Modal(modalElement);
                console.log('Bootstrap modal initialized successfully');
                document.getElementById('result').innerHTML = '<div class="alert alert-success">✅ Modal initialized successfully!</div>';
            } else {
                document.getElementById('result').innerHTML = '<div class="alert alert-danger">❌ Modal element not found!</div>';
            }
        });
        
        function testModal() {
            console.log('Testing modal');
            const modal = document.getElementById('installmentModal');
            console.log('Modal found:', !!modal);
            console.log('Bootstrap available:', typeof bootstrap !== 'undefined');
            console.log('Bootstrap.Modal available:', typeof bootstrap !== 'undefined' && bootstrap.Modal);
            console.log('installmentModal:', installmentModal);
            
            alert(`Modal Test Results:\n\n` +
                  `Modal Element: ${!!modal ? 'Found' : 'Not Found'}\n` +
                  `Bootstrap Available: ${typeof bootstrap !== 'undefined' ? 'Yes' : 'No'}\n` +
                  `installmentModal: ${installmentModal ? 'Initialized' : 'Not Initialized'}`);
        }
        
        function openModal() {
            console.log('Opening modal');
            if (installmentModal) {
                installmentModal.show();
            } else {
                alert('Modal not initialized!');
            }
        }
        
        function submitInstallment() {
            const amount = document.getElementById('modal-amount').value;
            const date = document.getElementById('modal-date').value;
            const notes = document.getElementById('modal-notes').value;
            
            console.log('Submitting:', { amount, date, notes });
            
            if (!amount || amount <= 0) {
                alert('Please enter a valid amount');
                return;
            }
            
            if (!date) {
                alert('Please select a date');
                return;
            }
            
            alert(`✅ Installment Added!\n\nAmount: ₹${amount}\nDate: ${date}\nNotes: ${notes || 'None'}`);
            
            if (installmentModal) {
                installmentModal.hide();
            }
        }
    </script>
</body>
</html>
