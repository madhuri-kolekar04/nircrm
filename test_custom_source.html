<!DOCTYPE html>
<html>
<head>
    <title>Test Custom Source Functionality</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Test Custom Source Functionality</h2>
        
        <form>
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="source" class="form-label">Source *</label>
                        <select class="form-select" id="source" name="source" required>
                            <option value="">Select Source</option>
                            <option value="website">Website</option>
                            <option value="referral">Referral</option>
                            <option value="social_media">Social Media</option>
                            <option value="email">Email</option>
                            <option value="phone">Phone</option>
                            <option value="advertisement">Advertisement</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-6" id="custom_source_div" style="display: none;">
                    <div class="mb-3">
                        <label for="custom_source" class="form-label">Enter the source</label>
                        <input type="text" class="form-control" 
                               id="custom_source" name="custom_source" 
                               placeholder="Please specify the source">
                    </div>
                </div>
            </div>
        </form>
        
        <div class="mt-3">
            <h5>Test Instructions:</h5>
            <ol>
                <li>Select "Other" from the Source dropdown</li>
                <li>The "Enter the source" text box should appear</li>
                <li>Select any other option from the Source dropdown</li>
                <li>The text box should disappear and its value should be cleared</li>
            </ol>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const sourceSelect = document.getElementById('source');
        const customSourceDiv = document.getElementById('custom_source_div');
        const customSourceInput = document.getElementById('custom_source');
        
        // Handle source dropdown change
        if (sourceSelect && customSourceDiv) {
            sourceSelect.addEventListener('change', function() {
                const selectedSource = this.value;
                
                if (selectedSource === 'other') {
                    customSourceDiv.style.display = 'block';
                    customSourceInput.required = true;
                } else {
                    customSourceDiv.style.display = 'none';
                    customSourceInput.required = false;
                    customSourceInput.value = '';
                }
            });
            
            // Check initial state on page load
            if (sourceSelect.value === 'other') {
                customSourceDiv.style.display = 'block';
                customSourceInput.required = true;
            }
        }
    });
    </script>
</body>
</html>
