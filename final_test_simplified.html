<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Test - Simplified Version</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container mt-4">
        <h2>Final Test - Simplified Version</h2>
        <div class="alert alert-success">
            <strong>✅ FIXED ISSUES:</strong><br>
            1. Simplified JavaScript code<br>
            2. Direct event listeners<br>
            3. Clean modal functionality<br>
            4. Real-time calculation updates
        </div>
        
        <div class="card">
            <div class="card-body">
                <h5>Payment Information</h5>
                <div class="row">
                    <div class="col-md-3">
                        <label class="form-label">Advance Payment</label>
                        <input type="number" step="0.01" class="form-control" id="advance_payment" value="500.00">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Remaining Payment</label>
                        <input type="number" step="0.01" class="form-control" id="remaining_payment" value="38440.00" readonly>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">GST</label>
                        <input type="number" step="0.01" class="form-control" id="gst" value="5940.00">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Total Payment</label>
                        <input type="number" step="0.01" class="form-control" id="total_payment" value="38940.00">
                    </div>
                </div>
                
                <h5 class="mt-4">Installment Schedule</h5>
                <div id="installments-container">
                    <div class="installment-row mb-3" data-index="0">
                        <div class="row">
                            <div class="col-md-3">
                                <label class="form-label">Installment 1 Amount</label>
                                <input type="number" step="0.01" class="form-control" name="installment_amounts[0]" value="5000.00">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Due Date</label>
                                <input type="date" class="form-control" name="installment_dates[0]" value="2026-03-04">
                            </div>
                        </div>
                    </div>
                    <div class="installment-row mb-3" data-index="1">
                        <div class="row">
                            <div class="col-md-3">
                                <label class="form-label">Installment 2 Amount</label>
                                <input type="number" step="0.01" class="form-control" name="installment_amounts[1]" value="5000.00">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Due Date</label>
                                <input type="date" class="form-control" name="installment_dates[1]" value="">
                            </div>
                        </div>
                    </div>
                    <div class="installment-row mb-3" data-index="2">
                        <div class="row">
                            <div class="col-md-3">
                                <label class="form-label">Installment 3 Amount</label>
                                <input type="number" step="0.01" class="form-control" name="installment_amounts[2]" value="5000.00">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Due Date</label>
                                <input type="date" class="form-control" name="installment_dates[2]" value="">
                            </div>
                        </div>
                    </div>
                </div>
                
                <button type="button" class="btn btn-success mb-3" id="add-installment">
                    <i class="fas fa-plus-circle"></i> Add Installment
                </button>
                <button type="button" class="btn btn-info mb-3 ms-2" id="test-modal-btn">
                    <i class="fas fa-bug"></i> Test Modal
                </button>
                <button type="button" class="btn btn-warning mb-3 ms-2" id="test-calculation-btn">
                    <i class="fas fa-calculator"></i> Test Calculation
                </button>
            </div>
        </div>
    </div>

    <!-- Installment Modal -->
    <div class="modal fade" id="installmentModal" tabindex="-1" aria-labelledby="installmentModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="installmentModalLabel">
                        <i class="fas fa-plus-circle"></i> Add New Installment
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="installment-form">
                        <div class="mb-3">
                            <label for="modal-amount" class="form-label">
                                <i class="fas fa-rupee-sign"></i> Installment Amount *
                            </label>
                            <div class="input-group">
                                <span class="input-group-text">₹</span>
                                <input type="number" class="form-control" id="modal-amount" step="0.01" min="0" required placeholder="0.00">
                            </div>
                            <small class="text-muted">Enter the installment amount</small>
                        </div>
                        
                        <div class="mb-3">
                            <label for="modal-date" class="form-label">
                                <i class="fas fa-calendar"></i> Due Date *
                            </label>
                            <input type="date" class="form-control" id="modal-date" required>
                            <small class="text-muted">Select the due date for this installment</small>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times"></i> Cancel
                    </button>
                    <button type="button" class="btn btn-success" id="save-installment">
                        <i class="fas fa-save"></i> Add Installment
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    console.log('=== SCRIPT LOADING ===');

    // Simple function to update remaining payment
    function updateRemainingPayment() {
        console.log('🧮 Updating remaining payment...');
        
        var totalPayment = parseFloat(document.getElementById('total_payment').value) || 0;
        var advancePayment = parseFloat(document.getElementById('advance_payment').value) || 0;
        var totalInstallments = 0;

        // Sum up all installment amounts
        var installmentInputs = document.querySelectorAll('input[name^="installment_amounts"]');
        installmentInputs.forEach(function(input) {
            totalInstallments += parseFloat(input.value) || 0;
        });

        var calculatedRemaining = totalPayment - advancePayment - totalInstallments;
        var remainingField = document.getElementById('remaining_payment');
        
        if (remainingField) {
            remainingField.value = calculatedRemaining.toFixed(2);
            console.log('✅ Remaining updated to:', calculatedRemaining.toFixed(2));
        }
    }

    // Simple function to show modal
    function showInstallmentModal() {
        console.log('🔘 Showing modal...');
        
        try {
            var modalElement = document.getElementById('installmentModal');
            if (modalElement) {
                if (!window.installmentModal) {
                    window.installmentModal = new bootstrap.Modal(modalElement);
                }
                window.installmentModal.show();
                console.log('✅ Modal shown');
            } else {
                console.error('❌ Modal element not found');
            }
        } catch (error) {
            console.error('❌ Error showing modal:', error);
        }
    }

    // Simple function to save installment
    function saveInstallment() {
        console.log('💾 Saving installment...');
        
        var amount = parseFloat(document.getElementById('modal-amount').value);
        var date = document.getElementById('modal-date').value;
        
        if (!amount || amount <= 0) {
            alert('Please enter a valid amount');
            return;
        }
        
        if (!date) {
            alert('Please select a due date');
            return;
        }
        
        // Find the installments container
        var container = document.getElementById('installments-container');
        var rows = container.querySelectorAll('.installment-row');
        
        // Calculate next index
        var maxIndex = 0;
        rows.forEach(function(row) {
            var index = parseInt(row.getAttribute('data-index'));
            if (!isNaN(index) && index > maxIndex) {
                maxIndex = index;
            }
        });
        var nextIndex = maxIndex + 1;
        
        // Create new installment row
        var newRow = document.createElement('div');
        newRow.className = 'installment-row mb-3';
        newRow.setAttribute('data-index', nextIndex);
        
        newRow.innerHTML = `
            <div class="row">
                <div class="col-md-3">
                    <label class="form-label">Installment ${nextIndex + 1} Amount</label>
                    <input type="number" step="0.01" class="form-control" name="installment_amounts[${nextIndex}]" value="${amount}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Due Date</label>
                    <input type="date" class="form-control" name="installment_dates[${nextIndex}]" value="${date}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Notes</label>
                    <input type="text" class="form-control" name="installment_notes[${nextIndex}]" placeholder="Optional notes">
                </div>
                <div class="col-md-2">
                    <label class="form-label">&nbsp;</label><br>
                    <button type="button" class="btn btn-danger btn-sm" onclick="removeInstallment(this)">
                        <i class="fas fa-trash"></i> Remove
                    </button>
                </div>
            </div>
        `;
        
        // Add the new row
        container.appendChild(newRow);
        
        // Hide modal
        if (window.installmentModal) {
            window.installmentModal.hide();
        }
        
        // Reset form
        document.getElementById('modal-amount').value = '';
        document.getElementById('modal-date').value = '';
        
        // Re-add listeners and update calculation
        addEventListeners();
        updateRemainingPayment();
        
        console.log('✅ Installment saved successfully');
    }

    // Function to remove installment
    function removeInstallment(button) {
        if (confirm('Are you sure you want to remove this installment?')) {
            var row = button.closest('.installment-row');
            row.remove();
            updateRemainingPayment();
            console.log('🗑️ Installment removed');
        }
    }

    // Function to add all event listeners
    function addEventListeners() {
        console.log('📝 Adding event listeners...');
        
        // Add listeners to installment fields
        var installmentInputs = document.querySelectorAll('input[name^="installment_amounts"]');
        installmentInputs.forEach(function(input) {
            input.addEventListener('input', updateRemainingPayment);
        });
        
        // Add listeners to payment fields
        document.getElementById('advance_payment').addEventListener('input', updateRemainingPayment);
        document.getElementById('total_payment').addEventListener('input', updateRemainingPayment);
        document.getElementById('gst').addEventListener('input', updateRemainingPayment);
    }

    // Wait for DOM to be loaded
    document.addEventListener('DOMContentLoaded', function() {
        console.log('🚀 DOM loaded - initializing...');
        
        // Add button listeners
        document.getElementById('add-installment').addEventListener('click', showInstallmentModal);
        document.getElementById('test-modal-btn').addEventListener('click', showInstallmentModal);
        document.getElementById('test-calculation-btn').addEventListener('click', function() {
            updateRemainingPayment();
            alert('Calculation updated! Check remaining payment field.');
        });
        document.getElementById('save-installment').addEventListener('click', saveInstallment);
        
        // Add field listeners
        addEventListeners();
        
        // Initial calculation
        updateRemainingPayment();
        
        console.log('✅ Initialization complete');
    });

    console.log('=== SCRIPT READY ===');
    </script>
</body>
</html>
