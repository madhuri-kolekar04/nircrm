<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Debug Test</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container mt-4">
        <h2>Simple Debug Test</h2>
        
        <div class="card">
            <div class="card-body">
                <h5>Payment Information</h5>
                <div class="row">
                    <div class="col-md-3">
                        <label class="form-label">Advance Payment</label>
                        <input type="number" step="0.01" class="form-control" id="advance_payment" value="500.00">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Remaining Payment</label>
                        <input type="number" step="0.01" class="form-control" id="remaining_payment" value="38440.00" readonly>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">GST</label>
                        <input type="number" step="0.01" class="form-control" id="gst" value="5940.00">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Total Payment</label>
                        <input type="number" step="0.01" class="form-control" id="total_payment" value="38940.00">
                    </div>
                </div>
                
                <h5 class="mt-4">Installment Schedule</h5>
                <div id="installments-container">
                    <div class="installment-row mb-3" data-index="0">
                        <div class="row">
                            <div class="col-md-3">
                                <label class="form-label">Installment 1 Amount</label>
                                <input type="number" step="0.01" class="form-control" name="installment_amounts[0]" value="5000.00">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Due Date</label>
                                <input type="date" class="form-control" name="installment_dates[0]" value="2026-03-04">
                            </div>
                        </div>
                    </div>
                    <div class="installment-row mb-3" data-index="1">
                        <div class="row">
                            <div class="col-md-3">
                                <label class="form-label">Installment 2 Amount</label>
                                <input type="number" step="0.01" class="form-control" name="installment_amounts[1]" value="5000.00">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Due Date</label>
                                <input type="date" class="form-control" name="installment_dates[1]" value="">
                            </div>
                        </div>
                    </div>
                    <div class="installment-row mb-3" data-index="2">
                        <div class="row">
                            <div class="col-md-3">
                                <label class="form-label">Installment 3 Amount</label>
                                <input type="number" step="0.01" class="form-control" name="installment_amounts[2]" value="5000.00">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Due Date</label>
                                <input type="date" class="form-control" name="installment_dates[2]" value="">
                            </div>
                        </div>
                    </div>
                </div>
                
                <button type="button" class="btn btn-success mb-3" id="add-installment">
                    <i class="fas fa-plus-circle"></i> Add Installment
                </button>
                <button type="button" class="btn btn-warning mb-3 ms-2" id="test-calculation-btn">
                    <i class="fas fa-calculator"></i> Test Calculation
                </button>
            </div>
        </div>
    </div>

    <!-- Installment Modal -->
    <div class="modal fade" id="installmentModal" tabindex="-1" aria-labelledby="installmentModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="installmentModalLabel">
                        <i class="fas fa-plus-circle"></i> Add New Installment
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="installment-form">
                        <div class="mb-3">
                            <label for="modal-amount" class="form-label">
                                <i class="fas fa-rupee-sign"></i> Installment Amount *
                            </label>
                            <div class="input-group">
                                <span class="input-group-text">₹</span>
                                <input type="number" class="form-control" id="modal-amount" step="0.01" min="0" required placeholder="0.00">
                            </div>
                            <small class="text-muted">Enter the installment amount</small>
                        </div>
                        
                        <div class="mb-3">
                            <label for="modal-date" class="form-label">
                                <i class="fas fa-calendar"></i> Due Date *
                            </label>
                            <input type="date" class="form-control" id="modal-date" required>
                            <small class="text-muted">Select the due date for this installment</small>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times"></i> Cancel
                    </button>
                    <button type="button" class="btn btn-success" id="save-installment">
                        <i class="fas fa-save"></i> Add Installment
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        console.log('=== SCRIPT START ===');
        
        // Simple test function
        function testCalculation() {
            console.log('🧮 Test calculation called');
            
            var totalPayment = parseFloat(document.getElementById('total_payment').value) || 0;
            var advancePayment = parseFloat(document.getElementById('advance_payment').value) || 0;
            var totalInstallments = 0;

            // Sum up all installment amounts
            var installmentInputs = document.querySelectorAll('input[name^="installment_amounts"]');
            console.log('Found installment inputs:', installmentInputs.length);
            
            installmentInputs.forEach(function(input) {
                var amount = parseFloat(input.value) || 0;
                totalInstallments += amount;
                console.log('Installment:', input.name, 'Value:', amount);
            });

            var calculatedRemaining = totalPayment - advancePayment - totalInstallments;
            var remainingField = document.getElementById('remaining_payment');
            
            if (remainingField) {
                remainingField.value = calculatedRemaining.toFixed(2);
                console.log('✅ Remaining payment updated to:', calculatedRemaining.toFixed(2));
            } else {
                console.error('❌ Remaining payment field not found!');
            }
            
            alert('Calculation Results:\n\n' +
                  'Total Payment: ₹' + totalPayment.toFixed(2) + '\n' +
                  'Advance Payment: ₹' + advancePayment.toFixed(2) + '\n' +
                  'Total Installments: ₹' + totalInstallments.toFixed(2) + '\n' +
                  'Calculated Remaining: ₹' + calculatedRemaining.toFixed(2));
        }
        
        // Simple modal function
        function showModal() {
            console.log('🔘 Show modal called');
            
            try {
                var modalElement = document.getElementById('installmentModal');
                console.log('Modal element:', modalElement);
                
                if (modalElement) {
                    if (typeof bootstrap !== 'undefined' && bootstrap.Modal) {
                        if (!window.installmentModal) {
                            window.installmentModal = new bootstrap.Modal(modalElement);
                        }
                        window.installmentModal.show();
                        console.log('✅ Modal shown successfully');
                    } else {
                        console.error('❌ Bootstrap Modal not available');
                        alert('Bootstrap Modal not available');
                    }
                } else {
                    console.error('❌ Modal element not found');
                    alert('Modal element not found');
                }
            } catch (error) {
                console.error('❌ Error showing modal:', error);
                alert('Error showing modal: ' + error.message);
            }
        }
        
        // Wait for DOM to be fully loaded
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded - setting up event listeners');
            
            // Test calculation button
            var testBtn = document.getElementById('test-calculation-btn');
            if (testBtn) {
                testBtn.addEventListener('click', testCalculation);
                console.log('✅ Test calculation button listener added');
            } else {
                console.error('❌ Test calculation button not found');
            }
            
            // Add installment button
            var addBtn = document.getElementById('add-installment');
            if (addBtn) {
                addBtn.addEventListener('click', showModal);
                console.log('✅ Add installment button listener added');
            } else {
                console.error('❌ Add installment button not found');
            }
            
            // Add listeners to installment fields
            var installmentInputs = document.querySelectorAll('input[name^="installment_amounts"]');
            installmentInputs.forEach(function(input) {
                input.addEventListener('input', testCalculation);
                console.log('✅ Listener added to:', input.name);
            });
            
            // Add listeners to payment fields
            var advanceField = document.getElementById('advance_payment');
            var totalField = document.getElementById('total_payment');
            var gstField = document.getElementById('gst');
            
            if (advanceField) {
                advanceField.addEventListener('input', testCalculation);
                console.log('✅ Listener added to advance payment');
            }
            
            if (totalField) {
                totalField.addEventListener('input', testCalculation);
                console.log('✅ Listener added to total payment');
            }
            
            if (gstField) {
                gstField.addEventListener('input', testCalculation);
                console.log('✅ Listener added to GST');
            }
            
            // Initial calculation
            testCalculation();
            
            console.log('=== SETUP COMPLETE ===');
        });
        
        console.log('=== SCRIPT END ===');
    </script>
</body>
</html>
