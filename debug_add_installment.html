<!DOCTYPE html>
<html>
<head>
    <title>Debug Add Installment Button</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2>Debug Add Installment Button</h2>
        
        <div class="card">
            <div class="card-header">
                <h5>Installment Schedule Test</h5>
            </div>
            <div class="card-body">
                <div id="installments-container">
                    <div class="installment-row mb-3" data-index="0">
                        <div class="row">
                            <div class="col-md-3">
                                <label class="form-label">Installment 1 Amount</label>
                                <input type="number" step="0.01" class="form-control" name="installment_amounts[0]" placeholder="0.00">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Due Date</label>
                                <input type="date" class="form-control" name="installment_dates[0]">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Notes</label>
                                <input type="text" class="form-control" name="installment_notes[0]" placeholder="Optional notes">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">&nbsp;</label><br>
                                <button type="button" class="btn btn-danger btn-sm remove-installment">
                                    <i class="fas fa-trash"></i> Remove
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <button type="button" class="btn btn-success mb-3" id="add-installment">
                    <i class="fas fa-plus-circle"></i> Add Installment
                </button>
                <small class="text-muted d-block mb-3">Click to add a new installment row with custom amount and due date</small>
                
                <div id="debug-info" class="mt-3">
                    <h6>Debug Information:</h6>
                    <div id="debug-output"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    $(document).ready(function() {
        console.log('Debug page loaded');
        
        function updateDebugInfo(message) {
            var timestamp = new Date().toLocaleTimeString();
            var debugHtml = `<div class="alert alert-info">[${timestamp}] ${message}</div>`;
            $('#debug-output').prepend(debugHtml);
        }
        
        updateDebugInfo('Page loaded successfully');
        
        // Check if the add installment button exists
        if ($('#add-installment').length) {
            updateDebugInfo('✅ Add Installment button found');
        } else {
            updateDebugInfo('❌ Add Installment button NOT found!');
            return;
        }

        // Check if installments container exists
        if ($('#installments-container').length) {
            updateDebugInfo('✅ Installments container found');
        } else {
            updateDebugInfo('❌ Installments container NOT found!');
            return;
        }
        
        updateDebugInfo('Current installment rows: ' + $('.installment-row').length);

        // Add installment row with extensive debugging
        $('#add-installment').click(function(e) {
            e.preventDefault();
            updateDebugInfo('🔘 Add Installment button CLICKED!');
            
            try {
                // Find the highest current index to avoid conflicts
                var currentIndex = 0;
                $('.installment-row').each(function() {
                    var rowIndex = parseInt($(this).data('index'));
                    updateDebugInfo(`Found row with index: ${rowIndex}`);
                    if (!isNaN(rowIndex) && rowIndex >= currentIndex) {
                        currentIndex = rowIndex + 1;
                    }
                });
                
                var index = currentIndex;
                updateDebugInfo(`📝 Adding installment with index: ${index}`);
                
                var html = `
                    <div class="installment-row mb-3 border border-success rounded p-2" data-index="${index}" style="background-color: #f8fff9;">
                        <div class="row">
                            <div class="col-md-3">
                                <label class="form-label"><strong>Installment ${index + 1} Amount</strong> <span class="text-success">(New)</span></label>
                                <input type="number" step="0.01" class="form-control" name="installment_amounts[${index}]" placeholder="0.00" autofocus>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Due Date</label>
                                <input type="date" class="form-control" name="installment_dates[${index}]">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Notes</label>
                                <input type="text" class="form-control" name="installment_notes[${index}]" placeholder="Optional notes">
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">&nbsp;</label><br>
                                <button type="button" class="btn btn-danger btn-sm remove-installment">
                                    <i class="fas fa-trash"></i> Remove
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                
                updateDebugInfo('📄 HTML generated, attempting to append...');
                $('#installments-container').append(html);
                updateDebugInfo('✅ HTML appended to container');
                
                // Check if the row was actually added
                var totalRows = $('.installment-row').length;
                updateDebugInfo(`📊 Total installment rows after adding: ${totalRows}`);
                
                // Scroll to the new installment row
                var newRow = $('#installments-container').find('.installment-row').last();
                if (newRow.length) {
                    updateDebugInfo('✅ New row found, scrolling to it...');
                    newRow[0].scrollIntoView({ behavior: 'smooth' });
                    
                    // Focus on the amount field
                    var amountField = newRow.find('input[type="number"]').first();
                    if (amountField.length) {
                        updateDebugInfo('🎯 Focusing on amount field...');
                        amountField.focus();
                    }
                    
                    // Show success message
                    var successMsg = `<div class="alert alert-success alert-dismissible fade show mb-2" id="installment-success-${index}">
                        <i class="fas fa-check-circle"></i> Installment ${index + 1} added successfully!
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>`;
                    newRow.before(successMsg);
                    updateDebugInfo('✅ Success message added');
                    
                    // Auto-hide success message after 3 seconds
                    setTimeout(function() {
                        $(`#installment-success-${index}`).fadeOut();
                    }, 3000);
                    
                    updateDebugInfo('🎉 Installment added successfully!');
                } else {
                    updateDebugInfo('❌ ERROR: Failed to find the new installment row!');
                    alert('Error: Failed to add installment. Please try again.');
                }
                
            } catch (error) {
                updateDebugInfo('❌ ERROR: ' + error.message);
                console.error('Error adding installment:', error);
                alert('Error adding installment: ' + error.message);
            }
        });

        // Remove installment row with confirmation
        $(document).on('click', '.remove-installment', function() {
            if (confirm('Are you sure you want to remove this installment?')) {
                $(this).closest('.installment-row').fadeOut(300, function() {
                    $(this).remove();
                    updateDebugInfo('🗑️ Installment removed');
                });
            }
        });
    });
    </script>
</body>
</html>
